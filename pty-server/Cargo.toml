[package]
name = "pty-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
portable-pty = "=0.9.0"
tokio = { version = "=1.51.1", features = ["macros", "rt-multi-thread", "sync", "signal", "io-util", "time"] }
tokio-tungstenite = "=0.29.0"
futures-util = "=0.3.32"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
base64 = "=0.22.1"
clap = { version = "=4.6.0", features = ["derive"] }
anyhow = "=1.0.102"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
