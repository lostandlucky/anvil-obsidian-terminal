[package]
name = "pty-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
portable-pty = "=0.9.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "signal", "io-util", "time"] }
tokio-tungstenite = "=0.30.0"
futures-util = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.23.1"
clap = { version = "=4.6.6", features = ["derive"] }
anyhow = "=1.0.104"
libc = "=0.2.189"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
